[project]
name = "b2b-risk-pipeline"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
  "asyncio>=4.0.0",
  "httpx>=0.28.1",
  "polars>=1.44.2",
  "polars-hash>=0.9.3",
  "psycopg[binary,pool]>=3.3.5",
  "pyarrow>=25.0.1",
  "pydantic>=2.13.5",
  "pydantic-settings>=2.15.0",
  "python-dateutil>=2.9.0.post0",
  "pyyaml>=6.0.3",
  "redis>=8.1.0",
  "tenacity>=9.1.4",
  "uuid-utils>=1.0.0",
]

[dependency-groups]
dev = [
  "ruff>=0.16.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.scripts]
worker = "main:main"

[tool.hatch.build.targets.wheel]
only-include = ["src", "main.py"]

